services:
  postgres:
    image: postgres:15-alpine
    container_name: leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leads_db
      POSTGRES_USER: leads_user
      POSTGRES_PASSWORD: leads_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads_user -d leads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./packages/backend
    container_name: leads-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://leads_user:leads_password@postgres:5432/leads_db
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
